name: Tests

# Runs tests/unit only -- fast and dependency-light by design (see
# docs/TESTING.md). Does NOT install insightface/onnxruntime/PySide6:
# tests/unit/ never needs them, and installing them here would make CI
# slow and heavy for no benefit. Tests that genuinely need those belong
# in tests/performance/, tests/accuracy/, or tests/integration/ instead.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install SQLAlchemy numpy Pillow imagehash psutil click pytest pytest-benchmark

      - name: Syntax check
        run: python -m py_compile $(find app tests -name "*.py")

      - name: Run unit tests
        run: pytest tests/unit -v
