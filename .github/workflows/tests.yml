name: Tests

# Runs the fast unit suite on Python 3.11/3.12. Python 3.11 also performs
# a headless GUI construction/navigation smoke test so desktop regressions
# are caught before Windows packaging.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install SQLAlchemy==2.0.32 cryptography==43.0.1 numpy==1.26.4 Pillow==10.4.0 imagehash==4.3.1 psutil==6.0.0 click==8.1.7 pytest==8.3.2 pytest-benchmark==4.0.0 opencv-python-headless==4.10.0.84

      - name: Syntax check
        run: python -m py_compile $(find app tests -name "*.py")

      - name: Run unit tests
        run: pytest tests/unit -v

      - name: Install Linux GUI runtime libraries
        if: matrix.python-version == '3.11'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Install GUI smoke-test dependency
        if: matrix.python-version == '3.11'
        run: pip install PySide6==6.7.2

      - name: Headless UI smoke test
        if: matrix.python-version == '3.11'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/ui_smoke_test.py
