name: Build CampPhoto AI for Windows

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:

    name: Build Windows EXE

    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"


      - name: Display Python version
        shell: pwsh
        run: |
          python --version
          python -m pip --version


      - name: Upgrade pip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel


      - name: Install project dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt


      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller


      - name: Verify important packages
        shell: pwsh
        run: |
          python -c "import cv2; print('OpenCV:', cv2.__version__)"
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import onnxruntime; print('ONNX Runtime:', onnxruntime.__version__)"
          python -c "import insightface; print('InsightFace installed')"
          python -c "import PySide6; print('PySide6 installed')"


      - name: Validate branding source asset
        shell: pwsh
        run: |
          python -c "from PIL import Image; im=Image.open('assets/campphoto_logo.png'); im.load(); print('Branding PNG verified:', im.size, im.mode)"

      - name: Syntax check
        shell: pwsh
        run: |
          python -m compileall -q app tests

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest

      - name: Smoke-test desktop UI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/ui_smoke_test.py


      - name: Clean previous build files
        shell: pwsh
        run: |
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
          }

          if (Test-Path dist) {
            Remove-Item -Recurse -Force dist
          }


      - name: Build Windows applications
        shell: pwsh
        run: |
          python -m PyInstaller pyinstaller.spec --noconfirm --clean


      - name: Download official buffalo_l model for build validation
        shell: pwsh
        env:
          BUFFALO_L_URL: https://github.com/deepinsight/insightface/releases/download/model-zoo/buffalo_l.zip
          BUFFALO_L_SHA256: 80ffe37d8a5940d59a7384c201a2a38d4741f2f3c51eef46ebb28218a7b0ca2f
        run: |
          New-Item -ItemType Directory -Force -Path ".build-models" | Out-Null
          $archive = ".build-models/buffalo_l.zip"

          Write-Host "Downloading official InsightFace buffalo_l model..."
          Invoke-WebRequest -Uri $env:BUFFALO_L_URL -OutFile $archive

          if (-not (Test-Path $archive)) {
            Write-Error "buffalo_l.zip was not downloaded"
            exit 1
          }

          $size = (Get-Item $archive).Length
          if ($size -lt 250000000) {
            Write-Error "buffalo_l.zip is unexpectedly small: $size bytes"
            exit 1
          }

          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:BUFFALO_L_SHA256.ToLowerInvariant()) {
            Write-Error "buffalo_l checksum mismatch. Expected $env:BUFFALO_L_SHA256, got $actual"
            exit 1
          }

          Write-Host "buffalo_l download verified successfully."

      - name: Bundle buffalo_l into Windows applications
        shell: pwsh
        run: |
          python scripts/bundle_buffalo_model.py --source ".build-models/buffalo_l.zip" --required

          $required = @(
            "det_10g.onnx",
            "1k3d68.onnx",
            "2d106det.onnx",
            "genderage.onnx",
            "w600k_r50.onnx"
          )

          foreach ($target in @("dist/CampPhotoAI", "dist/camp-photo-ai-cli")) {
            foreach ($name in $required) {
              $modelFile = Join-Path $target "models/buffalo_l/$name"
              if (-not (Test-Path $modelFile)) {
                Write-Error "Bundled model file missing: $modelFile"
                exit 1
              }

              if ((Get-Item $modelFile).Length -le 0) {
                Write-Error "Bundled model file is empty: $modelFile"
                exit 1
              }
            }
          }

          $notice = @(
            "CampPhoto AI build-validation model bundle",
            "Model: InsightFace buffalo_l",
            "Source: https://github.com/deepinsight/insightface/releases/download/model-zoo/buffalo_l.zip",
            "SHA-256: 80ffe37d8a5940d59a7384c201a2a38d4741f2f3c51eef46ebb28218a7b0ca2f",
            "Purpose: current product build/validation phase",
            "Note: third-party pretrained model rights are separate from the Camp Photo AI code licence."
          ) -join [Environment]::NewLine

          foreach ($target in @("dist/CampPhotoAI", "dist/camp-photo-ai-cli")) {
            Set-Content -Path (Join-Path $target "MODEL_SOURCE.txt") -Value $notice -Encoding UTF8
          }

          Write-Host "buffalo_l is bundled into both Windows applications."


      - name: Runtime smoke-test packaged applications
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Write-Host "Running packaged CLI self-check..."
          & "dist/camp-photo-ai-cli/camp-photo-ai-cli.exe" self-check
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Packaged CLI self-check failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "Starting packaged GUI in offscreen smoke-test mode..."
          $gui = Start-Process -FilePath "dist/CampPhotoAI/CampPhotoAI.exe" -ArgumentList "--smoke-test" -Wait -PassThru

          if ($gui.ExitCode -ne 0) {
            Write-Error "Packaged GUI smoke test failed with exit code $($gui.ExitCode)"
            exit $gui.ExitCode
          }

          Write-Host "Packaged GUI and CLI runtime checks passed."


      - name: Verify GUI executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/CampPhotoAI/CampPhotoAI.exe")) {
            Write-Error "CampPhotoAI.exe was not created"
            exit 1
          }

          Write-Host "GUI executable found successfully"


      - name: Verify CLI executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/camp-photo-ai-cli/camp-photo-ai-cli.exe")) {
            Write-Error "camp-photo-ai-cli.exe was not created"
            exit 1
          }

          Write-Host "CLI executable found successfully"


      - name: Create Windows distribution package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Copy-Item -Recurse `
            "dist/CampPhotoAI" `
            "release/CampPhotoAI"

          Copy-Item -Recurse `
            "dist/camp-photo-ai-cli" `
            "release/camp-photo-ai-cli"

          foreach ($file in @("START_HERE.txt", "USER_AGREEMENT.txt", "CONTACT.txt")) {
            Copy-Item `
              "packaging/$file" `
              "release/$file"
          }

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "release/LICENSE"
          }


      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "release/*" `
            -DestinationPath "CampPhotoAI-Windows-x64.zip" `
            -Force


      - name: Upload complete Windows package
        uses: actions/upload-artifact@v7
        with:
          name: CampPhotoAI-Windows-x64
          path: CampPhotoAI-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30


      - name: Upload GUI executable folder
        uses: actions/upload-artifact@v7
        with:
          name: CampPhotoAI-GUI-Windows
          path: dist/CampPhotoAI
          if-no-files-found: error
          retention-days: 30


      - name: Upload CLI executable folder
        uses: actions/upload-artifact@v7
        with:
          name: CampPhotoAI-CLI-Windows
          path: dist/camp-photo-ai-cli
          if-no-files-found: error
          retention-days: 30